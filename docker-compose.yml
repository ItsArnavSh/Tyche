services:
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build: ./core
    restart: unless-stopped
    expose:
      - "50051"
    environment:
      TYCHE_REDIS_HOST: redis
      TYCHE_REDIS_PORT: "6379"
      TYCHE_REDIS_ENABLED: "true"
      TYCHE_GRPC_PORT: "50051"
      TYCHE_SIGNAL_QUEUE: ${TYCHE_SIGNAL_QUEUE:-signal}
      TYCHE_SIGNAL_COOLDOWN_MS: ${TYCHE_SIGNAL_COOLDOWN_MS:-60000}
      TYCHE_WORKER_THREADS: ${TYCHE_WORKER_THREADS:-}
      TYCHE_CACHE_MAX_CANDLES: ${TYCHE_CACHE_MAX_CANDLES:-1500}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/50051'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build: ./gateway
    restart: unless-stopped
    # Pass every optional gateway setting from .env. The Go config owns the
    # defaults, so there is no second copy of the symbol/risk settings here.
    env_file:
      - path: .env
        required: false
    environment:
      TYCHE_CORE_ADDR: core:50051
      TYCHE_REDIS_ADDR: redis:6379
      TYCHE_STATUS_ADDR: ":8080"
    ports:
      - "${TYCHE_STATUS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      core:
        condition: service_healthy

  history:
    build:
      context: .
      dockerfile: history/Dockerfile
    restart: unless-stopped
    environment:
      HISTORY_HOST: 0.0.0.0
      HISTORY_PORT: "8090"
      HISTORY_CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/1
      HISTORY_CACHE_TTL: ${HISTORY_CACHE_TTL:-604800}
      HISTORY_MAX_WORKERS: ${HISTORY_MAX_WORKERS:-8}
      HISTORY_FETCH_TIMEOUT: ${HISTORY_FETCH_TIMEOUT:-15}
      HISTORY_FETCH_RETRIES: ${HISTORY_FETCH_RETRIES:-3}
    ports:
      - "${TYCHE_HISTORY_PORT:-8090}:8090"
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build: ./monitoring/client
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  redis_data:
