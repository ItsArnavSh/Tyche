services:
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build: ./core
    expose:
      - "50051"

    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build: ./gateway
    depends_on:
      redis:
        condition: service_healthy

  monitoring-core:
    build: ./monitoring/server
    depends_on:
      redis:
        condition: service_healthy

  monitoring-client:
    build: ./monitoring/client
    depends_on:
      monitoring-core:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  redis_data:
