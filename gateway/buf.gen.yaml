version: v2
# The gateway owns the single proto source at proto/stockrec.proto.
# Generate Go stubs into gateway/proto:
#   cd gateway && buf generate
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: proto
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: proto
    opt:
      - paths=source_relative
